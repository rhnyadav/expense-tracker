<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#111111"
  >

  <link
    rel="manifest"
    href="manifest.json"
  >

  <title>Expense Tracker</title>

  <link
    rel="stylesheet"
    href="Style.css"
  >

</head>


<body>

  <div class="app">


    <!-- Header -->

    <header class="header">

      <div class="logo">
        💰
      </div>

      <div>

        <h1>
          Expense Tracker
        </h1>

        <p>
          Track your daily expenses
        </p>

      </div>

    </header>


    <!-- Add Transaction -->

    <section class="card">

      <h2>
        Add Transaction
      </h2>


      <form id="expenseForm">


        <!-- Item Name -->

        <div class="field">

          <label for="item">
            Item Name
          </label>

          <input
            type="text"
            id="item"
            placeholder="Petrol, Salary, Lunch..."
            autocomplete="off"
            required
          >

        </div>


        <!-- Expense Amount -->

        <div class="field">

          <label for="amount">
            Expense Amount
          </label>

          <input
            type="number"
            id="amount"
            placeholder="Enter expense amount"
            min="0"
            inputmode="decimal"
          >

        </div>


        <!-- Received Amount -->

        <div class="field">

          <label for="receivedAmount">
            Received Amount
          </label>

          <input
            type="number"
            id="receivedAmount"
            placeholder="Enter received amount"
            min="0"
            inputmode="decimal"
          >

        </div>


        <!-- Category -->

        <div class="field">

          <label for="category">
            Category
          </label>

          <select id="category">

            <option value="Food">
              Food
            </option>

            <option value="Travel">
              Travel
            </option>

            <option value="Shopping">
              Shopping
            </option>

            <option value="Bills">
              Bills
            </option>

            <option value="Recharge">
              Recharge
            </option>

            <option value="Salary">
              Salary
            </option>

            <option value="Income">
              Income
            </option>

            <option value="Other">
              Other
            </option>

          </select>

        </div>


        <!-- Save -->

        <button
          type="submit"
          class="save-btn"
        >
          Save Transaction
        </button>


      </form>

    </section>


    <!-- Summary -->

    <section class="summary">


      <div class="summary-card">

        <p>
          Total Expense
        </p>

        <h2>
          ₹<span id="totalExpense">0</span>
        </h2>

      </div>


      <div class="summary-card received-card">

        <p>
          Total Received
        </p>

        <h2>
          ₹<span id="totalReceived">0</span>
        </h2>

      </div>


      <div class="summary-card net-card">

        <p>
          Net Balance
        </p>

        <h2>
          ₹<span id="netExpense">0</span>
        </h2>

      </div>


    </section>


    <!-- Transactions -->

    <section class="card">


      <div class="section-header">

        <h2>
          Transactions
        </h2>


        <button
          type="button"
          id="clearAll"
          class="clear-btn"
        >
          Clear All
        </button>

      </div>


      <div id="expenseList">

        <p class="empty">
          No transactions yet.
        </p>

      </div>


    </section>


  </div>


  <!-- Main JavaScript -->

  <script src="App.js"></script>


  <!-- Service Worker -->

  <script>

    if ("serviceWorker" in navigator) {

      window.addEventListener(
        "load",
        function () {

          navigator.serviceWorker
            .register("./service-worker.js")
            .catch(function (error) {

              console.log(
                "Service Worker registration failed:",
                error
              );

            });

        }
      );

    }

  </script>


</body>

</html>
